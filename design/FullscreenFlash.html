<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap">
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #ffffff; } a:hover { color: #d9e4e0; }
  </style>

<div style="width: 390px; height: 844px; background: #102b27; color: #f2f4f3; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 28px 24px 0;">
    <div style="font-size: 13px; color: #7f9691; letter-spacing: 0.08em;">DAY 14</div>
    <div style="display: flex; gap: 6px;">
      <div style="width: 24px; height: 4px; border-radius: 2px; background: #f2f4f3;"></div>
      <div style="width: 24px; height: 4px; border-radius: 2px; background: #2c4a44;"></div>
      <div style="width: 24px; height: 4px; border-radius: 2px; background: #2c4a44;"></div>
      <div style="width: 24px; height: 4px; border-radius: 2px; background: #2c4a44;"></div>
      <div style="width: 24px; height: 4px; border-radius: 2px; background: #2c4a44;"></div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 24px;">
    <div style="font-size: 17px; color: #9fb3ae; line-height: 1.5;">買い物に行きたい</div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; line-height: 1.12; letter-spacing: -0.01em;">I want to<br>go shopping.</div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 24px; color: #e8c987;">I wanna</div>
      <div style="font-size: 13px; color: #7f9691;">と縮まって聞こえる</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 24px 48px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; background: #f2f4f3; color: #102b27; border-radius: 999px; font-size: 17px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
      実際の声を聞く
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #2c4a44; border-radius: 999px; font-size: 14px; font-weight: 600; color: #c9d6d2;">もう一度</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #2c4a44; border-radius: 999px; font-size: 14px; font-weight: 600; color: #c9d6d2;">次へ →</div>
    </div>
  </div>
</div>

</body>
</html>
