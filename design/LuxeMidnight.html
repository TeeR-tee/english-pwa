<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;display=swap">
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #b99a5f; } a:hover { color: #d0b378; }
  </style>

<div style="width: 390px; height: 844px; background: #0c1524; color: #e8ecf2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 30px 26px 0;">
    <div style="font-family: 'Marcellus', Georgia, serif; font-size: 15px; letter-spacing: 0.12em; color: #e8ecf2;">Day 14</div>
    <div style="font-size: 12px; color: #6d7a8c;">出会った 14 ・ 耳 6 ・ 口 3</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 0 26px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; letter-spacing: 0.18em; color: #b99a5f;">今日の1フレーズ ─ 1 / 5</div>
      <div style="font-size: 16px; color: #9aa5b4;">買い物に行きたい</div>
    </div>

    <div style="background: linear-gradient(160deg, #13223a 0%, #0e1a2e 100%); border: 1px solid #24344d; border-radius: 14px; padding: 30px 26px; display: flex; flex-direction: column; gap: 18px;">
      <div style="font-family: 'Marcellus', Georgia, serif; font-size: 36px; line-height: 1.22;">I want to go shopping.</div>
      <div style="height: 1px; background: linear-gradient(90deg, #b99a5f 0%, rgba(185, 154, 95, 0) 100%);"></div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-family: 'Marcellus', Georgia, serif; font-size: 22px; color: #b99a5f;">I wanna</span>
          <span style="font-size: 12px; color: #6d7a8c;">と縮まって聞こえる</span>
        </div>
        <div style="font-size: 11px; color: #47536a;">聞こえ方の一例: アイワナ ゴウショッピング</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; background: #b99a5f; color: #0c1524; border-radius: 8px; font-size: 15px; font-weight: 700;">
        <svg width="16" height="16" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
        実際の声を聞く
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9aa5b4;">
        <span>ゆっくり</span>
        <span>会話の速さ</span>
        <span>自分の言い方に</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #24344d; border-radius: 8px; color: #e8ecf2; font-size: 14px; font-weight: 600;">次へ</div>
  </div>

  <div style="display: flex; border-top: 1px solid #1a2739; padding: 10px 0 24px; background: #0a1220;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b99a5f; font-size: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle></svg>
      今日
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #47536a; font-size: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2.5l2-6 3 12 3-9 2 5 2-2H21"></path></svg>
      冒頭音
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #47536a; font-size: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      しらべる
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #47536a; font-size: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      例文帳
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #47536a; font-size: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="18" cy="12" r="1.3" fill="currentColor"></circle></svg>
      その他
    </div>
  </div>
</div>

</body>
</html>
