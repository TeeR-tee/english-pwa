<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #173b36; } a:hover { color: #0f2925; }
  </style>

<div style="width: 390px; height: 844px; background: #f7f6f2; color: #1c1f1e; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 24px 20px 0; flex-grow: 1;">

    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 23px; font-weight: 700; letter-spacing: -0.01em;">今日</div>
      <div style="display: flex; gap: 10px; font-size: 12px; color: #7a807d;">
        <span>3日連続</span><span>出会った 14</span><span>耳 6</span>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e5e0; border-radius: 12px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #b3b8b5; letter-spacing: 0.04em;">
        <span>1 / 5</span><span style="color: #7a807d;">気持ち・希望</span>
      </div>

      <div style="font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em;">買い物に行きたい</div>

      <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 600; line-height: 1.3; color: #173b36;">I want to go shopping.</div>
      <div style="font-size: 13px; color: #7a807d; line-height: 1.5;">冒頭は <b style="color: #1c1f1e; font-family: 'Helvetica Neue', Arial, sans-serif;">I wanna</b> と縮まる<br><span style="color: #b3b8b5;">聞こえ方の一例: アイワナ ゴウショッピング</span></div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; background: #173b36; border-radius: 8px; color: #ffffff; font-size: 16px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"></polygon></svg>
        実際の声を聞く
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; border: 1px solid #e6e5e0; border-radius: 8px; font-size: 13px; font-weight: 600;">ゆっくり</div>
        <div style="display: flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; border: 1px solid #e6e5e0; border-radius: 8px; font-size: 13px; font-weight: 600;">会話の速さ</div>
        <div style="margin-left: auto; font-size: 13px; color: #7a807d;">自分の言い方に</div>
      </div>

      <div style="display: flex; gap: 8px; border-top: 1px solid #e6e5e0; padding-top: 14px;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 40px; border: 1px solid #173b36; background: #eef3f1; color: #173b36; border-radius: 8px; font-size: 13px; font-weight: 600;">聞き取れた</div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 40px; border: 1px solid #e6e5e0; border-radius: 8px; font-size: 13px; font-weight: 600;">口に出した</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; background: #173b36; border-radius: 8px; color: #ffffff; font-size: 15px; font-weight: 600;">次へ</div>
    </div>

    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #7a807d; margin-top: 12px;">場面から思い出す</div>
    <div style="background: #ffffff; border: 1px solid #e6e5e0; border-radius: 12px; overflow: hidden;">
      <div style="padding: 14px 20px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 15px; font-weight: 600;">『そろそろ始めよっか』と確認したい</div>
        <div style="font-size: 12px; color: #7a807d;">提案する・誘う</div>
      </div>
      <div style="border-top: 1px solid #e6e5e0; padding: 14px 20px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 15px; font-weight: 600;">『私がやるよ』と引き受けたい</div>
        <div style="font-size: 12px; color: #7a807d;">申し出る</div>
      </div>
    </div>
  </div>

  <div style="display: flex; background: #ffffff; border-top: 1px solid #e6e5e0; padding: 8px 0 22px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #173b36; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle></svg>
      今日
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b3b8b5; font-size: 11px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2.5l2-6 3 12 3-9 2 5 2-2H21"></path></svg>
      冒頭音
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b3b8b5; font-size: 11px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      しらべる
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b3b8b5; font-size: 11px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      例文帳
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b3b8b5; font-size: 11px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.4" fill="currentColor"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor"></circle><circle cx="18" cy="12" r="1.4" fill="currentColor"></circle></svg>
      その他
    </div>
  </div>
</div>

</body>
</html>
