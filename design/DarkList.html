<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap">
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #c9a96a; } a:hover { color: #ddc08a; }
  </style>

<div style="width: 390px; height: 844px; background: #101012; color: #ecebe7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0; padding: 30px 26px 0;">

    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px;">
      <div style="font-size: 11px; letter-spacing: 0.2em; color: #c9a96a;">きょうの5つ</div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid #1c1c20;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9a96a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      <div style="display: flex; flex-direction: column;">
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: #b7b6ae;">Can I ask you something?</div>
        <div style="font-size: 11px; color: #6e6d75;">ちょっと聞いていい？</div>
      </div>
    </div>

    <div style="border: 1px solid #c9a96a; background: #17171a; padding: 24px 22px; margin: 6px 0; display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 14px; color: #cfcec6;">買い物に行きたい</div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 36px; font-weight: 500; line-height: 1.16;">I want to go shopping.</div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 22px; color: #c9a96a;">I wanna</span>
        <span style="font-size: 12px; color: #b7b6ae;">アイワナ と縮まる</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border: 1px solid #c9a96a; color: #c9a96a; font-size: 13px; font-weight: 600; letter-spacing: 0.1em;">
          <svg width="13" height="13" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
          実際の声
        </div>
        <div style="display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 16px; border: 1px solid #2a2a2e; color: #cfcec6; font-size: 13px;">ゆっくり</div>
        <div style="display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 16px; background: #c9a96a; color: #101012; font-size: 13px; font-weight: 700;">済</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid #1c1c20;">
      <div style="width: 18px; height: 18px; border: 1px solid #3a3a40; border-radius: 50%;"></div>
      <div style="display: flex; flex-direction: column;">
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: #8f8e96;">I feel like eating out today.</div>
        <div style="font-size: 11px; color: #56555c;">今日は外食の気分</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid #1c1c20;">
      <div style="width: 18px; height: 18px; border: 1px solid #3a3a40; border-radius: 50%;"></div>
      <div style="display: flex; flex-direction: column;">
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: #8f8e96;">I'll let you know.</div>
        <div style="font-size: 11px; color: #56555c;">あとで知らせるね</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid #1c1c20; border-bottom: 1px solid #1c1c20;">
      <div style="width: 18px; height: 18px; border: 1px solid #3a3a40; border-radius: 50%;"></div>
      <div style="display: flex; flex-direction: column;">
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: #8f8e96;">Could you write it down?</div>
        <div style="font-size: 11px; color: #56555c;">書いてもらえる？</div>
      </div>
    </div>
  </div>

  <div style="display: flex; border-top: 1px solid #2a2a2e; padding: 10px 0 24px; background: #101012;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #c9a96a; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle></svg>
      今日
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8f8e96; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2.5l2-6 3 12 3-9 2 5 2-2H21"></path></svg>
      冒頭音
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8f8e96; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      しらべる
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8f8e96; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      例文帳
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8f8e96; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="18" cy="12" r="1.3" fill="currentColor"></circle></svg>
      その他
    </div>
  </div>
</div>

</body>
</html>
