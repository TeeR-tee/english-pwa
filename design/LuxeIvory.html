<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&amp;display=swap">
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #9d7f45; } a:hover { color: #7f6534; }
  </style>

<div style="width: 390px; height: 844px; background: #f3f0e9; color: #17150f; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 30px 28px 0;">
    <div style="font-size: 12px; letter-spacing: 0.22em; color: #17150f;">TODAY</div>
    <div style="font-size: 12px; color: #97917f;">3日連続 ・ 1 / 5</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 0 28px;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="height: 1px; width: 30px; background: #9d7f45;"></div>
      <div style="font-size: 11px; letter-spacing: 0.2em; color: #9d7f45;">今日の1フレーズ</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 16px; color: #6f6a5c;">買い物に行きたい</div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 500; line-height: 1.12; color: #17150f;">I want to<br>go shopping.</div>
      <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #17150f; padding-top: 16px; margin-top: 4px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 25px; color: #9d7f45;">I wanna</span>
          <span style="font-size: 12px; color: #97917f;">と縮まって聞こえる</span>
        </div>
        <div style="font-size: 11px; color: #b6b1a2;">聞こえ方の一例: アイワナ ゴウショッピング</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; background: #17150f; color: #f3f0e9; font-size: 14px; font-weight: 600; letter-spacing: 0.12em;">
        <svg width="15" height="15" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
        実際の声を聞く
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px; color: #6f6a5c;">
        <span style="border-bottom: 1px solid #c9c3b2; padding-bottom: 3px;">ゆっくり</span>
        <span style="border-bottom: 1px solid #c9c3b2; padding-bottom: 3px;">会話の速さ</span>
        <span style="border-bottom: 1px solid #c9c3b2; padding-bottom: 3px;">自分の言い方に</span>
        <span style="border-bottom: 1px solid #17150f; padding-bottom: 3px; color: #17150f; font-weight: 600;">次へ →</span>
      </div>
    </div>
  </div>

  <div style="display: flex; border-top: 1px solid #ddd7c7; padding: 10px 0 24px; background: #f3f0e9;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #17150f; font-size: 10px; font-weight: 600; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle></svg>
      今日
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b6b1a2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2.5l2-6 3 12 3-9 2 5 2-2H21"></path></svg>
      冒頭音
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b6b1a2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      しらべる
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b6b1a2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      例文帳
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b6b1a2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="18" cy="12" r="1.3" fill="currentColor"></circle></svg>
      その他
    </div>
  </div>
</div>

</body>
</html>
