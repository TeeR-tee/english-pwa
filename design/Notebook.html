<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&amp;family=Shippori+Mincho:wght@500;700&amp;display=swap">
</head>
<body>


  <style>
    body { margin: 0; font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif; }
    a { color: #173b36; } a:hover { color: #0f2925; }
  </style>

<div style="width: 390px; height: 844px; background: #f6f1e7; color: #2b2a26; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 30px 28px 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 15px; color: #8a8272;">Phrase of the day</div>
      <div style="font-size: 12px; color: #8a8272;">八月三十一日</div>
    </div>
    <div style="height: 1px; background: #2b2a26;"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 0 28px;">
    <div style="font-size: 19px; font-weight: 700; letter-spacing: 0.02em;">買い物に行きたい</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 44px; font-weight: 500; line-height: 1.18; letter-spacing: -0.01em;">I want to go shopping.</div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <div style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 22px; color: #9a5b2d;">I wanna —</div>
        <div style="font-size: 12px; color: #8a8272;">冒頭はこう縮まる</div>
      </div>
    </div>

    <div style="border-top: 1px solid #d9d0bf; padding-top: 18px; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; color: #8a8272; letter-spacing: 0.14em;">きょうの余白</div>
      <div style="font-size: 14px; line-height: 1.9; color: #5c564a;">自分ならいつ言う？　仕事帰り、コンビニの前で——</div>
      <div style="height: 1px; background: #d9d0bf;"></div>
      <div style="height: 1px; background: #d9d0bf; margin-top: 22px;"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 28px 44px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; background: #2b2a26; color: #f6f1e7; font-size: 15px; letter-spacing: 0.06em;">
      <svg width="16" height="16" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
      実際の声を聞く
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8a8272;">
      <span style="border-bottom: 1px solid #8a8272; padding-bottom: 2px;">ゆっくり再生</span>
      <span style="border-bottom: 1px solid #8a8272; padding-bottom: 2px;">ノートに写す</span>
      <span style="border-bottom: 1px solid #8a8272; padding-bottom: 2px;">次の頁へ</span>
    </div>
  </div>
</div>

</body>
</html>
