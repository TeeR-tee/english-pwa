<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#000}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    a { color: #173b36; } a:hover { color: #0f2925; }
  </style>

<div style="width: 390px; height: 844px; background: #f7f6f2; color: #1c1f1e; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 24px 20px 12px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #e6e5e0; background: #f7f6f2;">
    <div style="font-size: 23px; font-weight: 700;">タイムライン</div>
    <div style="font-size: 12px; color: #7a807d;">毎朝7:00に届く</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b3b8b5;">
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
      今日 8月31日
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #173b36; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 12px; color: #7a807d;">7:00 に届いた1フレーズ</div>
        <div style="font-size: 11px; color: #173b36; background: #eef3f1; border-radius: 999px; padding: 3px 10px; font-weight: 600;">NEW</div>
      </div>
      <div style="font-size: 20px; font-weight: 700;">買い物に行きたい</div>
      <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 24px; font-weight: 600; color: #173b36; line-height: 1.3;">I want to go shopping.</div>
      <div style="font-size: 12px; color: #7a807d;">冒頭は <b style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #1c1f1e;">I wanna</b></div>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; background: #173b36; color: #ffffff; border-radius: 8px; font-size: 14px; font-weight: 600;">
          <svg width="16" height="16" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
          実際の声
        </div>
        <div style="display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border: 1px solid #e6e5e0; border-radius: 8px; font-size: 14px; font-weight: 600;">できた</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b3b8b5;">
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
      きのう
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e5e0; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#173b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 600; color: #4c5350;">What if it doesn't work?</div>
        <div style="font-size: 12px; color: #7a807d;">うまくいかなかったらどうする？ ・ 聞いた 2回</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e5e0; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b3b8b5" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 600; color: #4c5350;">I'll let you know.</div>
        <div style="font-size: 12px; color: #7a807d;">あとで知らせるね ・ 未再生</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b3b8b5;">
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
      8月29日
      <div style="height: 1px; background: #e6e5e0; flex-grow: 1;"></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e5e0; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#173b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 600; color: #4c5350;">Can I ask you something?</div>
        <div style="font-size: 12px; color: #7a807d;">ちょっと聞いていい？ ・ 口に出した</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
